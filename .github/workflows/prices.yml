name: Prices

# 価格パイプラインの単一の入口（2026-09-09 に launchd から移設）。
#
# 経緯: 従来は fetch-prices.yml（Amazon / 2026-08-21 に schedule 停止）と
# ローカル Mac の launchd `com.pickly.price-history.plist` が併存し、
# 後者は push が rejected で失敗し続けたまま19日間気づかれなかった。
# Mac のスリープに依存せず、失敗が Actions のログに残る形へ一本化する。
#
# ジョブ構成:
#   snapshot  毎日  price-history.json に1点追記（外部APIなし・数秒）
#   amazon    毎日  PA-API で Amazon 価格を取得（PAAPI_* 未設定ならスキップ）
#   refresh-rakuten 週2回 楽天の全件リフレッシュ
#   refresh-yahoo   週2回 Yahoo の全件リフレッシュ（楽天と独立・並行）
#   staleness 毎日  鮮度ゲート。閾値超過で赤くなる＝止まったら気づける
#
# 2026-09-11: refresh を楽天/Yahoo の2ジョブに分割した。従来は
# 「楽天全件 → Yahoo全件 → snapshot → commit」の直列1ジョブで、
# 楽天が timeout-minutes(300) に達すると **commit に到達せず成果がゼロ**
# になっていた（run 34406617612: 全件 403 Invalid Access Key のまま5時間）。
# 分割して各ジョブが自分の成果を自分でコミットするので、片方が死んでも
# もう片方は残る。

on:
  schedule:
    # 毎日 10:00 JST（01:00 UTC）— 日次の軽い処理
    - cron: "0 1 * * *"
    # 月・木 04:00 JST（前日 19:00 UTC）— 全件リフレッシュ（重い）
    - cron: "0 19 * * 0,3"
  workflow_dispatch:
    inputs:
      job:
        description: "実行するジョブ"
        required: true
        default: "daily"
        type: choice
        options: [daily, refresh, refresh-rakuten, refresh-yahoo, staleness]

concurrency:
  # 全件リフレッシュと日次が重なると同じキャッシュを奪い合うので直列化する。
  # 楽天とYahooは別ファイルなので互いに衝突しないが、commit-prices の
  # push が競合するためグループは共有のままにする。
  group: prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── 日次: Amazon 取得 → 履歴追記 ──────────────────────────────────────────
  daily:
    if: github.event.schedule == '0 1 * * *' || github.event.inputs.job == 'daily'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site

      # PAAPI_* が未設定なら fetch-prices.ts 側がスキップを表示して正常終了する。
      # 売上要件（直近30日に10件以上の適格売上）未達でも AccessDenied で中断し、
      # 既存の価格を保ったまま終わる（価格を空にはしない）。
      - name: Amazon 価格を取得 (PA-API)
        env:
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: npm run prices:fetch
        working-directory: site

      - name: 価格履歴を1点追記
        run: npm run prices:snapshot
        working-directory: site

      - uses: ./.github/actions/commit-prices
        with:
          message: "data(price): Amazon 価格と価格履歴を更新（日次）"
          paths: >-
            site/src/lib/affiliates/prices-override.ts
            site/src/lib/affiliates/price-history.json
          # price-history.json は1ファイル1行の生成物なので、並行 push と
          # rebase がぶつかると必ず行全体が衝突する。テキストで解かず、
          # 取り込んだ最新キャッシュからスナップショットを取り直す
          # （外部APIは叩かない・数秒）。
          regenerate: npm --prefix site run prices:snapshot

  # ── 週2回: 楽天/Yahoo 全件リフレッシュ ────────────────────────────────────
  # ── 週2回: 楽天の全件リフレッシュ ────────────────────────────────────────
  # 楽天と Yahoo を分けてあるのは、片方が落ちてももう片方の成果を残すため。
  # 直列1ジョブだった頃は楽天のタイムアウトで Yahoo もコミットも道連れだった。
  refresh-rakuten:
    if: >-
      github.event.schedule == '0 19 * * 0,3' ||
      github.event.inputs.job == 'refresh' ||
      github.event.inputs.job == 'refresh-rakuten'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site

      - name: 楽天を全件リフレッシュ
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: npx tsx scripts/fetch-rakuten.ts --refresh
        working-directory: site

      # フェッチが途中で落ちても、そこまでのキャッシュ（25件ごとに書き出し）は
      # コミットする。always() が無いと「5時間走って成果ゼロ」が再発する。
      - name: 価格履歴を1点追記
        if: always()
        run: npm run prices:snapshot
        working-directory: site

      - uses: ./.github/actions/commit-prices
        if: always()
        with:
          message: "data(price): 楽天を全件リフレッシュ（週2回）"
          paths: >-
            site/src/lib/affiliates/rakuten-cache.json
            site/src/lib/affiliates/price-history.json
          regenerate: npm --prefix site run prices:snapshot

  # ── 週2回: Yahoo の全件リフレッシュ ──────────────────────────────────────
  refresh-yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # 楽天と同じ price-history.json を触るので push の競合を避けて後に回すが、
    # always() 付きなので **楽天が失敗・タイムアウトしても必ず走る**。
    # needs だけだと楽天の失敗で Yahoo が skip され、分割した意味が無くなる。
    needs: [refresh-rakuten]
    if: >-
      always() && (
        github.event.schedule == '0 19 * * 0,3' ||
        github.event.inputs.job == 'refresh' ||
        github.event.inputs.job == 'refresh-yahoo'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          # refresh-rakuten が push した最新を取る
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site

      - name: Yahoo を全件リフレッシュ
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          AFFILIATE_VALUECOMMERCE_SID: ${{ secrets.AFFILIATE_VALUECOMMERCE_SID }}
          AFFILIATE_VALUECOMMERCE_PID: ${{ secrets.AFFILIATE_VALUECOMMERCE_PID }}
        run: npx tsx scripts/fetch-yahoo.ts --refresh
        working-directory: site

      - name: 価格履歴を1点追記
        if: always()
        run: npm run prices:snapshot
        working-directory: site

      - uses: ./.github/actions/commit-prices
        if: always()
        with:
          message: "data(price): Yahoo を全件リフレッシュ（週2回）"
          paths: >-
            site/src/lib/affiliates/yahoo-cache.json
            site/src/lib/affiliates/price-history.json
          regenerate: npm --prefix site run prices:snapshot

  # ── 鮮度ゲート ────────────────────────────────────────────────────────────
  staleness:
    # daily が走った後に見たいが、daily がスキップ/失敗でも鮮度は確認したいので always()
    needs: [daily]
    if: >-
      always() &&
      (github.event.schedule == '0 1 * * *' || github.event.inputs.job == 'staleness')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # daily ジョブが push した最新をチェックアウトする
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: 価格データの鮮度を確認
        # WARN_ONLY は外した（2026-09-12）。
        #
        # 「PA-API 鍵の登録が済むまで」という理由で置かれていたが、鍵が無い間は
        # check-price-staleness.ts 側が Amazon を警告止まり（problems に入れない）に
        # しているので、WARN_ONLY が無くても Amazon が理由で赤くなることはない。
        # 現在のデータで素のまま実行して exit 0 になることを実測で確認済み。
        #
        # 一方で WARN_ONLY が残っていると、楽天/Yahoo の鮮度超過も、PR #25 で
        # 入れた「全件横ばい」検出も、すべて緑のまま通ってしまう。止まったことに
        # 気づくためのゲートが常に緑なら意味がない。
        run: npm run prices:staleness
        working-directory: site
