name: Deploy (OG → R2 + Pages)

# Builds the static site in CI (so OG image generation can run for the full
# ~50 min without hitting Cloudflare Pages' 20-minute build cap), uploads the
# 1000x1500 OG/Pinterest images to Cloudflare R2 (served from OG_BASE_URL so
# they don't count against the Pages Free-plan 20,000-file limit), then deploys
# the static export with `wrangler pages deploy`.
#
# Required repo settings (Settings → Secrets and variables → Actions):
#   Secrets: CLOUDFLARE_API_TOKEN (Account: Pages Edit + Workers R2 Storage Edit),
#            CLOUDFLARE_ACCOUNT_ID,
#            R2_ACCESS_KEY_ID (= the API token's id; the S3 secret is derived at
#            runtime as SHA-256 of the token value, so no S3 secret is stored)
#   Variables: CLOUDFLARE_PROJECT_NAME (Pages project), R2_BUCKET,
#              OG_BASE_URL (the R2 public domain, e.g. https://pub-xxxx.r2.dev)
#
# Disable the Cloudflare Pages git-integration auto-build so only this workflow
# deploys (otherwise both fight and the auto-build ships without OG images).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      og_force:
        description: "OG画像を既存でも作り直す (タイトル変更後はこれを付けないと古い文字のまま)"
        type: boolean
        default: false
      og_locale:
        description: "OG再生成をこのロケールだけに絞る (例: it。空なら全ロケール=約50分)"
        type: string
        default: ""
  schedule:
    # Daily ~03:17 UTC: the price-fetch job commits with [skip ci] (which does
    # not trigger push workflows), so a scheduled deploy keeps live prices fresh
    # and heals any missing OG images on R2.
    - cron: "17 3 * * *"

concurrency:
  group: deploy-${{ github.ref }}
  # false にしている理由 (2026-08-13): ビルドは約11分かかる。翻訳の自動コミットが
  # 2分おきに push すると、cancel-in-progress: true では毎回途中で殺され、
  # 90分間1本もデプロイされないという飢餓状態になった。false なら実行中の1本は
  # 必ず完走し、待機中は GitHub が最新1本だけ残して古いものを捨てるので、
  # 「常に最新が出る」性質は保ったまま前に進む。
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - name: Install CJK / Arabic / emoji fonts (for OG glyphs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji \
            fonts-noto-unhinted rclone
          sudo fc-cache -f

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Install wrangler
        run: npm i -g wrangler@4

      - name: Verify R2 access (fail fast before the long generate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          SECRET=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          export RCLONE_CONFIG_R2_TYPE=s3 RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$SECRET"
          export RCLONE_CONFIG_R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export RCLONE_CONFIG_R2_REGION=auto
          rclone lsd "R2:${R2_BUCKET}" && echo "R2 auth OK"

      # Cache generated OG images so only NEW/changed articles regenerate.
      # Key changes when any article message file or the generator changes;
      # restore-keys lets us reuse the most recent cache for incremental runs.
      - name: Cache OG images
        uses: actions/cache@v6
        with:
          path: site/og-dist
          # og-v2: Top-N 製品リスト入りテンプレ（2026-07-21）。世代を上げると旧キャッシュを
          # 復元しなくなり、全画像が新テンプレで再生成される（restore-keysが旧世代を
          # 拾うと OG_FORCE 無しでは既存分がスキップされるため、テンプレ変更時は世代を上げること）。
          key: og-v2-${{ hashFiles('site/src/articles/**/messages/**', 'site/scripts/generate-og.ts') }}
          restore-keys: |
            og-v2-

      # 既定は incremental（既存PNGはスキップ）。記事タイトルを変えても本文が同じだと
      # ファイル名が変わらないため、既存スキップのままだと OG は古い文字を焼いたままになる。
      # タイトル変更後は workflow_dispatch から og_force=true（必要なら og_locale=it 等で
      # 対象を絞る）で再生成すること。全ロケール強制は約50分。
      - name: Generate OG images
        env:
          OG_FORCE: ${{ inputs.og_force && '1' || '' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.og_locale }}" ]; then ARGS="--locale=${{ inputs.og_locale }}"; fi
          echo "OG_FORCE=${OG_FORCE:-0} ARGS=${ARGS:-(none)}"
          npm run og:generate -- $ARGS

      - name: Upload OG images to R2 (rclone, S3 via derived creds)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          # R2 S3 secret = SHA-256 of the API token value (Cloudflare derivation);
          # access key id = the token id (R2_ACCESS_KEY_ID). No separate S3 keys stored.
          SECRET=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$SECRET"
          export RCLONE_CONFIG_R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export RCLONE_CONFIG_R2_REGION=auto
          # --size-only: skip objects already present with the same size (self-healing,
          # uploads only missing/changed). One process, parallel, with retries.
          # rclone auto-sets Content-Type image/png from the .png extension.
          rclone copy og-dist "R2:${R2_BUCKET}/og" \
            --size-only --transfers=32 --checkers=64 --retries 3 \
            --stats=20s --stats-one-line

      # Legacy OG images were committed under site/public/og (~6.4k files). They
      # now live on R2 — drop them so they don't bloat the static export back
      # over the 20k-file Pages limit.
      # ★ビルド前の門番 (2026-08-17)。en.json にキーを足して他ロケールへ展開し忘れると、
      #   BODY_KEYS 欠落で本文が完訳済みの記事まで /en/ へ meta-refresh する stub になる。
      #   ビルドも build 後の HTML 検査も通ってしまう(ページは200を返し noindex なので
      #   GSC にも出ない)ので、ソース側で欠落数のラチェットとして止める。
      #   スクリプト自体は前からあったが CI から一度も呼ばれておらず、事故を検知できなかった。
      - name: Gate i18n key gaps
        run: npm run audit:i18n

      - name: Exclude legacy committed OG from the build
        run: rm -rf public/og

      - name: Build static site
        env:
          NEXT_PUBLIC_OG_BASE_URL: ${{ vars.OG_BASE_URL }}
        run: npm run build

      # ★出力に対する門番。ソースを読んでも分からない不具合を止める (2026-08-04):
      #   アフィリタグの無い Amazon リンク625本(クリックしても1円にならない)、
      #   全ロケールで英語のままの <title> 971ページ、「Pickly | Pickly」の二重ブランド。
      #   いずれも画面上は正常に見えるので、出来上がった HTML を検査するしかない。
      - name: Gate the built output
        run: npm run check:output

      # Cloudflare Pages は1デプロイ20,000ファイルまで。記事の解放でこれを超えて
      # デプロイが落ちた(2026-08-03: 20,361ファイル)。Next の静的エクスポートは
      # ページごとに index.html と index.txt(クライアント遷移用のRSCペイロード)を
      # 出すので、noindexロケールの .txt だけ落として枠を空ける。
      # 検索に出ないページのソフト遷移が失敗してもハードナビゲーションに
      # フォールバックするだけで、表示は壊れない。
      # 2026-08-05: 6ロケールぶんでは足りなくなった。マーケットに合わせた買い口を
      # 出せるようにすると +約4,000ページ増え、25,012ファイルで再び落ちた。
      # .txt は「クライアント遷移を速くするための複製」であって、ページの中身は
      # index.html に全部入っている。落としても検索にも表示にも影響しない
      # (ソフト遷移がハードナビゲーションに戻るだけ)。**コンテンツを削るより先に
      # ここを削る** — 記事やロケールを畳むのは元に戻せない判断なので後回しにする。
      - name: Trim RSC payloads
        run: |
          before=$(find out -type f | wc -l)
          # -mindepth 2: ルート直下の .txt (robots.txt / llms.txt / IndexNow鍵) は残す。
          # 消してよいのはページ配下の RSC ペイロード .txt だけ。
          # (2026-08-11: 旧条件が IndexNow 鍵ファイルまで消し、Bing への
          #  一括送信が鍵検証404で全滅していた)
          # -type f 必須: _next/static/chunks/app/robots.txt/ という「ディレクトリ」が
          # 存在し、-delete がディレクトリに当たると Directory not empty で落ちる
          find out -mindepth 2 -type f -name '*.txt' -delete
          after=$(find out -type f | wc -l)
          echo "files: $before -> $after (Pages limit 20000)"
          if [ "$after" -ge 20000 ]; then
            echo "::error::static export still has $after files (>=20000). Pages deploy will fail."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy out \
            --project-name="${{ vars.CLOUDFLARE_PROJECT_NAME }}" \
            --branch=main
